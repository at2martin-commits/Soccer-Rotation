function scorekeeperClick(b) {
  switch (b.dataset.action) {
    case "sk-period":
      sk.period = Number(b.dataset.qi);
      skCommit();
      break;
    case "sk-goal": {
      const p = sk.players.find((x) => x.id === Number(b.dataset.id));
      if (!p) break;
      openDialog(`<h2>Goal for ${esc(skName(p))}?</h2><p class="hint">${esc(periodName(sk.format, sk.period))}</p>
        <div class="dlg-actions"><button class="btn" type="button" data-d="cancel">Cancel</button>
          <button class="btn primary" type="button" data-d="ok" autofocus>Add goal</button></div>`, {
        ok: () => { sk.goals.push({ id: p.id, p: sk.period }); closeDialog(); skCommit(); toast("Goal: " + skName(p) + " · " + periodName(sk.format, sk.period)); },
      });
      break;
    }
    case "sk-opp":
      openDialog(`<h2>Goal for ${esc(oppName(sk))}?</h2><p class="hint">${esc(periodName(sk.format, sk.period))}</p>
        <div class="dlg-actions"><button class="btn" type="button" data-d="cancel">Cancel</button>
          <button class="btn primary" type="button" data-d="ok" autofocus>Add goal</button></div>`, {
        ok: () => { sk.oppGoals.push({ p: sk.period }); closeDialog(); skCommit(); toast(oppName(sk) + " goal · " + periodName(sk.format, sk.period)); },
      });
      break;
    case "remove-goal":
      sk.goals.splice(Number(b.dataset.i), 1);
      skCommit();
      break;
    case "remove-opp-goal":
      sk.oppGoals.splice(Number(b.dataset.i), 1);
      skCommit();
      break;
    case "sk-done":
      sk.done = true;
      skCommit();
      window.scrollTo(0, 0);
      break;
    case "sk-edit":
      sk.done = false;
      skCommit();
      break;
    case "sk-send":
      shareLink("Final score: " + scoreLine({ name: sk.team }, skGame()), scoreResultLink());
      break;
  }
}

// ------------------------------------------------------------------ Coach sync
// Two (or more) coaches keep the same team on their phones. "Share with a coach" packs the team
// (players, schedule, lineups, goals, season totals, past seasons) into a link, compressed after
// the "#", so it goes only where the coach sends it. Opening or scanning it on the other phone
// adds the team, or merges it: each player, each game and the team's settings keep whichever copy
// was changed last, and deletions carry over. Codes are checked like a backup.
//
// Link: #team=z<deflated JSON, base64url>, or #team=j<JSON, base64url> where a phone can't compress.

const SYNC_QR_MAX = 1500; // longer links make QR codes too dense to scan from a phone screen
const SYNC_MAX_CHARS = 400000, SYNC_MAX_BYTES = 2000000;

/** A new player, game or season id. Shared teams get random ids, so two coaches adding at once don't clash. */
function newItemId(t) {
  if (!t || !t.sync) return state.nextId++;
  const used = new Set(allIds());
  let id;
  do id = 1e6 + Math.floor(Math.random() * (1e9 - 1e6)); while (used.has(id));
  state.nextId = Math.max(state.nextId, id + 1);
  return id;
}
function allIds() {
  const ids = [];
  state.teams.forEach((t) => {
    ids.push(t.id);
    [t.players, t.games, t.archives].forEach((list) => list.forEach((x) => ids.push(x.id)));
    t.archives.forEach((a) => a.games.forEach((g) => ids.push(g.id)));
  });
  return ids;
}
/** Remembers deleted ids on a shared team, so the other coach's copy deletes them too. */
function forget(t, ids) {
  if (t.sync) t.gone = [...(t.gone || []), ...ids].slice(-SYNC_GONE_MAX);
}
function randomSyncId() {
  const a = new Uint8Array(10);
  crypto.getRandomValues(a);
  return [...a].map((x) => (x % 36).toString(36)).join("");
}

const b64url = (bytes) => {
  let s = "";
  for (let i = 0; i < bytes.length; i += 8192) s += String.fromCharCode(...bytes.subarray(i, i + 8192));
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
};
const fromB64url = (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));
async function readStream(stream, max) {
  const reader = stream.getReader(), parts = [];
  let size = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    size += value.length;
    if (size > max) { reader.cancel(); throw new Error("too big"); }
    parts.push(value);
  }
  const out = new Uint8Array(size);
  parts.reduce((at, x) => { out.set(x, at); return at + x.length; }, 0);
  return out;
}
async function packSync(obj) {
  const json = new TextEncoder().encode(JSON.stringify(obj));
  if (typeof CompressionStream === "function") {
    try { return "z" + b64url(await readStream(new Blob([json]).stream().pipeThrough(new CompressionStream("deflate-raw")), SYNC_MAX_BYTES)); } catch (e) {}
  }
  return "j" + b64url(json);
}
/** The team in a link, cleaned like a backup, or null. */
async function unpackSync(raw) {
  const m = String(raw).match(/#team=([zj])([A-Za-z0-9_-]+)/);
  if (!m || m[2].length > SYNC_MAX_CHARS) return null;
  try {
    let bytes = fromB64url(m[2]);
    if (m[1] === "z") bytes = await readStream(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw")), SYNC_MAX_BYTES);
    return cleanShared(JSON.parse(new TextDecoder().decode(bytes)));
  } catch (e) {
    return null;
  }
}

/** What goes in a link, kept short. Kids are written as their place in `ids` (2 characters):
 *  lineups as spot + kid pairs and a bench (like the scorekeeper's), goals as kid + period, the other
 *  team's goals as periods. Fields that cleaning fills back in the same way are left out, and so are
 *  names saved on played games that match the roster. */
function sharedTeam(t) {
  const roster = Object.fromEntries(t.players.map((p) => [p.id, p.name]));
  const ids = [...new Set([...t.players.map((p) => p.id), ...t.games.flatMap((g) =>
    [...(g.plan || []).flatMap((q) => [...Object.values(q.positions), ...q.bench]), ...g.goals.map((x) => x.id), ...(g.absent || [])])])];
  const at = new Map(ids.map((id, i) => [id, b36(i).padStart(2, "0")]));
  const lineup = (plan) => plan && plan.map((q) => POS_ORDER.filter((k) => q.positions[k] != null).map((k) => b36(POS_ORDER.indexOf(k)) + at.get(q.positions[k])).join("") +
    "|" + q.bench.map((id) => at.get(id)).join("") + (q.formation ? "|" + q.formation : ""));
  const empty = (v) => v === "" || v === null || v === false || (Array.isArray(v) ? !v.length : typeof v === "object" && !Object.keys(v).length);
  const lean = (o, keep) => Object.fromEntries(Object.entries(o).filter(([k, v]) => keep.includes(k) || !empty(v)));
  return { v: 1, sync: t.sync, id: t.id, name: t.name, formation: t.formation, format: t.format, style: t.style, changed: t.changed,
    absent: t.absent, carry: t.seasonCarry, gone: t.gone || [], archives: t.archives, ids,
    players: t.players.map(({ goalie, ...p }) => ({ ...lean(p, []), ...(goalie ? {} : { goalie }) })),
    games: t.games.map((g) => lean({ ...g, plan: null, lineup: lineup(g.plan), goals: g.goals.map((x) => at.get(x.id) + x.p).join(""),
      oppGoals: g.oppGoals.map((x) => x.p).join(""), absent: g.absent && g.absent.map((id) => at.get(id)).join(""), names: Object.fromEntries(Object.entries(g.names).filter(([id, n]) => roster[id] !== n)),
      formation: g.formation === t.formation ? null : g.formation, format: g.format === t.format ? null : g.format }, g.absent ? ["absent"] : [])) };
}
function cleanShared(o) {
  o = plainObject(o);
  if (o.v !== 1 || !isSyncId(o.sync)) return null;
  const ids = Array.isArray(o.ids) ? o.ids : [];
  const kids = (s) => (typeof s === "string" ? s.match(/[0-9a-z]{2}/g) || [] : []).map((i) => ids[parseInt(i, 36)]);
  const period = (s) => {
    const [field = "", bench = "", formation] = String(s).split("|"), positions = {};
    for (const [, k, i] of field.matchAll(/([0-9a-z])([0-9a-z]{2})/g)) if (POS_ORDER[parseInt(k, 36)]) positions[POS_ORDER[parseInt(k, 36)]] = ids[parseInt(i, 36)];
    return { positions, bench: kids(bench), formation };
  };
  const games = (Array.isArray(o.games) ? o.games : []).filter((g) => g && typeof g === "object").map((g) => ({ ...g,
    plan: Array.isArray(g.lineup) ? g.lineup.slice(0, 8).map(period) : null,
    goals: (typeof g.goals === "string" ? g.goals.match(/[0-9a-z]{2}\d/g) || [] : []).map((x) => ({ id: ids[parseInt(x.slice(0, 2), 36)], p: Number(x[2]) })),
    oppGoals: (typeof g.oppGoals === "string" ? g.oppGoals.match(/\d/g) || [] : []).map((p) => ({ p: Number(p) })),
    absent: typeof g.absent === "string" ? kids(g.absent) : undefined }));
  const s = normalize({ teams: [{ ...o, games, seasonCarry: plainObject(o.carry) }] });
  const t = s && s.teams[0];
  if (!t) return null;
  t.sync = o.sync;
  t.gone = t.gone || [];
  t.part = o.part === 1;
  const roster = Object.fromEntries(t.players.map((p) => [p.id, p.name]));
  t.games.forEach((g) => {
    if (!g.played) return;
    const ids = [...(g.plan || []).flatMap((q) => [...Object.values(q.positions), ...q.bench]), ...(g.absent || [])];
    ids.forEach((id) => { if (g.names[id] == null && roster[id] != null) g.names[id] = roster[id]; });
  });
  return t;
}

const lastChange = (g) => Math.max(0, ...Object.values(g.changed || {}));
/** The link for a team, and a QR code; when everything doesn't fit in a code, it holds the games changed last. */
async function syncLinks(t) {
  const full = sharedTeam(t);
  const link = appUrl() + "#team=" + (await packSync(full));
  if (link.length <= SYNC_QR_MAX) return { link, qr: link, games: full.games.length, total: full.games.length };
  // Past seasons and deletions inside them wait for the link; then the oldest changes drop out.
  const archived = new Set(t.archives.flatMap((a) => a.games.map((g) => g.id)));
  const part = { ...full, part: 1, archives: [], gone: full.gone.filter((id) => !archived.has(id)),
    games: full.games.slice().sort((a, b) => lastChange(b) - lastChange(a)) };
  let qr = null;
  for (let lo = 0, hi = part.games.length; lo <= hi;) {
    const mid = (lo + hi) >> 1;
    const l = appUrl() + "#team=" + (await packSync({ ...part, games: part.games.slice(0, mid) }));
    if (l.length <= SYNC_QR_MAX) { qr = { link: l, n: mid }; lo = mid + 1; } else hi = mid - 1;
  }
  return { link, qr: qr && qr.link, games: qr ? qr.n : 0, total: full.games.length };
}

/** Merges a shared copy into ours (without changing ours): for each player, game and the team's settings, the copy changed last wins. */
function mergeTeam(mine, inc) {
  const gone = new Set([...(mine.gone || []), ...inc.gone]);
  const log = { players: { added: [], updated: [], removed: [] }, games: { added: [], updated: [], removed: [] }, archives: [], settings: false, kept: 0 };
  // Each part (a player, or a game's details, lineup and score) keeps the copy changed last.
  const player = (x, y) => (unstamped(x) === unstamped(y) ? [x, 0, 0] : (y.changed || 0) > (x.changed || 0) ? [y, 1, 0] : [x, 0, 1]);
  const game = (x, y) => {
    const ours = gameParts(x), theirs = gameParts(y), g = { ...x, changed: { ...x.changed } };
    let took = 0, kept = 0;
    Object.keys(GAME_PARTS).forEach((part) => {
      if (unstamped(ours[part]) === unstamped(theirs[part])) return;
      if (partStamp(y, part) <= partStamp(x, part)) { kept = 1; return; }
      took = 1;
      GAME_PARTS[part].forEach((k) => { if (k in y) g[k] = y[k]; else delete g[k]; });
      g.changed[part] = partStamp(y, part);
    });
    return [took ? g : x, took, kept];
  };
  const list = (key, one) => {
    const theirs = new Map(inc[key].map((x) => [x.id, x])), out = [];
    mine[key].forEach((x) => {
      const y = theirs.get(x.id);
      if (gone.has(x.id)) { log[key].removed.push(x); return; }
      const [z, took, kept] = y ? one(x, y) : [x, 0, 0];
      out.push(z);
      if (took) log[key].updated.push(z);
      log.kept += kept;
    });
    const have = new Set(mine[key].map((x) => x.id));
    inc[key].forEach((y) => { if (!have.has(y.id) && !gone.has(y.id)) { out.push(y); log[key].added.push(y); } });
    return out;
  };
  const merged = { ...mine, players: list("players", player), games: list("games", game), gone: [...gone].slice(-SYNC_GONE_MAX) };
  const haveArchive = new Set(mine.archives.map((a) => a.id));
  log.archives = inc.archives.filter((a) => !haveArchive.has(a.id) && !gone.has(a.id));
  merged.archives = [...mine.archives.filter((a) => !gone.has(a.id)), ...log.archives];
  if (unstamped(teamSettings(mine)) !== unstamped(teamSettings(inc))) {
    if ((inc.changed || 0) > (mine.changed || 0)) {
      log.settings = true;
      Object.assign(merged, { name: inc.name, formation: inc.formation, format: inc.format, absent: inc.absent, seasonCarry: inc.seasonCarry, changed: inc.changed });
      if (inc.style) merged.style = inc.style; else delete merged.style;
    } else log.kept++;
  }
  log.changes = log.archives.length + (log.settings ? 1 : 0) + ["players", "games"].reduce((n, k) => n + log[k].added.length + log[k].updated.length + log[k].removed.length, 0);
  return { team: merged, log };
}

// Coach side: show the code and the link.
async function coachShareDialog(t) {
  if (!t.sync) { t.sync = randomSyncId(); commit(); }
  const { link, qr, games, total } = await syncLinks(t);
  const svg = qr ? qrSVG(qr, "Team code for " + t.name) : "";
  const more = total - games;
  openDialog(`<h2>Share with another coach</h2>
    <p class="hint">Your assistant coach scans this code, or opens the link you send. They get ${esc(t.name)} on their phone: players, schedule, lineups, goals and season totals. After a game, whoever has the newest changes shares again and the other phone adds just what changed.</p>
    ${svg ? `<div class="qr-box">${svg}</div>` : ""}
    ${more ? `<p class="hint">${svg ? `Too much for one code, so it holds the ${games} most recently changed ${games === 1 ? "game" : "games"}${t.archives.length ? " and no past seasons" : ""}.` : "Too much for a code."} <strong>Send link</strong> shares everything.</p>`
      : !svg ? `<p class="hint">Past seasons make this too much for a code. <strong>Send link</strong> shares everything.</p>` : ""}
    <div class="btn-row">
      <button class="btn grow" type="button" data-d="send">${ICON.share} Send link</button>
      <button class="btn grow" type="button" data-d="get">${ICON.scan} Get their update</button>
    </div>
    <p class="hint">Send it by text or email. Nothing is uploaded: the team is inside the link itself.</p>
    <div class="dlg-actions"><button class="btn primary" type="button" data-d="cancel">Done</button></div>`, {
    send: () => shareLink(t.name + ": team update from Soccer Rotation", link),
    get: () => scanDialog("team"),
  });
}

/** Opening, scanning or pasting a team link. */
async function useTeamCode(raw) {
  const inc = await unpackSync(raw);
  if (!inc) {
    openDialog(`<h2>That team link is damaged</h2>
      <p class="hint">Part of it is missing, which can happen when a long link is copied or a text message cuts it. Ask the coach to send it again, or scan their code.</p>
      <div class="dlg-actions"><button class="btn primary" type="button" data-d="cancel">OK</button></div>`);
    return;
  }
  const mine = state.teams.find((x) => x.sync === inc.sync);
  const part = inc.part ? `<p class="hint">This code has only the games changed last. Ask the coach to <strong>Send link</strong> for everything.</p>` : "";
  const gameLabel = (g) => (g.opponent ? "vs " + g.opponent : "Game") + " · " + toDate(g.date).toLocaleDateString(undefined, { month: "short", day: "numeric" }) +
    (g.played ? " · " + g.goals.length + "–" + g.oppGoals.length : "");
  if (!mine) {
    const played = inc.games.filter((g) => g.played).length;
    openDialog(`<h2>Add ${esc(inc.name)}?</h2>
      <p class="hint">Another coach shared this team: ${roster(inc).length} ${roster(inc).length === 1 ? "player" : "players"}, ${inc.games.length} ${inc.games.length === 1 ? "game" : "games"}${played ? ` (${played} played)` : ""}${inc.archives.length ? `, ${inc.archives.length} past ${inc.archives.length === 1 ? "season" : "seasons"}` : ""}. When either of you shares again, the other phone gets the changes.</p>
      ${part}
      <div class="dlg-actions"><button class="btn" type="button" data-d="cancel">Cancel</button>
        <button class="btn primary" type="button" data-d="ok">Add team</button></div>`, {
      ok: () => {
        delete inc.part;
        if (state.teams.some((x) => x.id === inc.id)) inc.id = newItemId(inc);
        state.teams.push(inc);
        finishSync(inc, inc.name + " added");
      },
    });
    return;
  }
  const { team: merged, log } = mergeTeam(mine, inc);
  const names = (list, f) => esc(list.map(f).join(", "));
  const line = (label, list, f) => (list.length ? `<li><strong>${label}:</strong> ${names(list, f)}</li>` : "");
  const changes = [
    line("New games", log.games.added, gameLabel), line("Updated games", log.games.updated, gameLabel), line("Deleted games", log.games.removed, gameLabel),
    line("New players", log.players.added, (p) => p.name), line("Updated players", log.players.updated, (p) => p.name), line("Removed players", log.players.removed, (p) => p.name),
    line("Past seasons", log.archives, (a) => a.name), log.settings ? `<li><strong>Team settings</strong> (name, size, game, who's here, season totals)</li>` : "",
  ].join("");
  const kept = log.kept ? `<p class="hint">You changed ${log.kept} ${log.kept === 1 ? "thing" : "things"} more recently; ${log.kept === 1 ? "it stays" : "they stay"} as you have ${log.kept === 1 ? "it" : "them"}.</p>` : "";
  if (!log.changes) {
    openDialog(`<h2>${esc(mine.name)} is up to date</h2>
      <p class="hint">This phone already has everything in that code.</p>${kept}${part}
      <div class="dlg-actions"><button class="btn primary" type="button" data-d="cancel">OK</button></div>`);
    return;
  }
  openDialog(`<h2>Update ${esc(mine.name)}?</h2>
    <p class="hint">Changes from the other coach:</p>
    <ul class="sync-list">${changes}</ul>${kept}${part}
    <div class="dlg-actions"><button class="btn" type="button" data-d="cancel">Cancel</button>
      <button class="btn primary" type="button" data-d="ok">Update team</button></div>`, {
    ok: () => {
      Object.keys(mine).forEach((k) => delete mine[k]);
      Object.assign(mine, merged);
      finishSync(mine, mine.name + " updated");
    },
  });
}
function finishSync(t, message) {
  state.nextId = Math.max(state.nextId, ...allIds().map((x) => x + 1));
  stampChanges(true); // keep the other coach's stamps
  state.currentTeamId = t.id;
  ui = { tab: "games", gameId: null };
  closeDialog();
  commit();
  window.scrollTo(0, 0);
  toast(message);
}

// ------------------------------------------------------------------ Actions

const SAMPLE_NAMES = ["Ava", "Ben", "Chloe", "Diego", "Emma", "Finn", "Grace", "Hiro"];
const MORE_NAMES = ["Isla", "Jack", "Kenji", "Lucia", "Mateo", "Nora", "Omar", "Priya"];
const SAMPLE_NUMBERS = ["4", "7", "10", "2", "9", "11", "5", "13", "8", "3", "12", "6", "15", "21", "1", "17"];
const SAMPLE_OPPONENTS = ["Tigers", "Sharks", "Comets", "Falcons", "Wildcats", "Rockets", "Hornets", "Dragons", "Lightning", "Storm"];

/** Beta only: a roster sized for the team (about 1.5 times the field) and 8–10 weekly games. */
function fillSampleTeam(t) {
  const field = FORMATIONS[t.formation].fill.length;
  const names = [...SAMPLE_NAMES, ...MORE_NAMES].slice(0, Math.min(16, Math.ceil(field * 1.5)));
  const spots = formationPositions(t.formation).filter((k) => k !== "GK");
  names.forEach((name, i) => t.players.push({
    id: newItemId(t), name, number: SAMPLE_NUMBERS[i],
    goalie: i !== 2, // one kid who doesn't play goal
    preferred: i === 0 && hasGoalie(t.formation) ? ["GK"] : i === 1 ? [spots[spots.length - 1]] : i === 3 ? [spots[0]] : [],
  }));
  addSampleGames(t);
}
/** 8–10 weekly Saturday games from next Saturday, home and away taking turns. */
function addSampleGames(t) {
  const games = 8 + Math.floor(Math.random() * 3);
  const opponents = shuffle(SAMPLE_OPPONENTS.slice());
  const sat = new Date(); sat.setDate(sat.getDate() + ((6 - sat.getDay() + 7) % 7 || 7)); // next Saturday
  let side = Math.random() < 0.5 ? "home" : "away";
  for (let i = 0; i < games; i++) {
    t.games.push({ id: newItemId(t), date: addDays(dateStr(sat), i * 7), opponent: opponents[i], home: side,
      plan: null, formation: t.formation, format: t.format, played: false, names: {}, goals: [], oppGoals: [], time: "", place: "" });
    side = side === "home" ? "away" : "home";
  }
}

document.getElementById("about-btn").addEventListener("click", aboutDialog);
document.getElementById("team-btn").addEventListener("click", () => (sk ? null : state.teams.length ? teamMenu() : teamDialog(null)));
document.querySelectorAll("nav.tabs [data-tab]").forEach((b) => b.addEventListener("click", () => {
  // Tapping Games while already there goes back to the list.
  if (b.dataset.tab === "games" && ui.tab === "games") ui.gameId = null;
  if (b.dataset.tab === "season" && ui.tab === "season") { ui.archiveId = null; ui.archiveGameId = null; }
  ui.tab = b.dataset.tab;
  render();
  window.scrollTo(0, 0);
}));

document.getElementById("main").addEventListener("submit", (e) => {
  if (e.target.dataset.form !== "add-player") return;
  e.preventDefault();
  const input = document.getElementById("add-name");
  const name = input.value.trim();
  if (!name) return;
  const t = team();
  t.players.push({ id: newItemId(t), name, number: "", goalie: true, preferred: [] });
  commit();
  document.getElementById("add-name").focus();
});


// Goals take a double-tap so a stray tap can't add one. A lone tap gets a reminder instead.
let lastTap = null, tapHintTimer = null;
function doubleTap(key, hint) {
  const now = Date.now();
  clearTimeout(tapHintTimer);
  if (lastTap && lastTap.key === key && now - lastTap.at < 450) { lastTap = null; return true; }
  lastTap = { key, at: now };
  tapHintTimer = setTimeout(() => { if (lastTap && lastTap.key === key) toast(hint); }, 500);
  return false;
}

function addGoal(t, g, qi, slot) {
  const id = playerAt(g.plan[qi], slot);
  if (id == null) { render(); return; }
  if (!slot.startsWith("F:")) {
    render();
    toast("Only players on the field can score");
    return;
  }
  g.goals.push({ id, p: qi });
  commit();
  toast("Goal: " + gameNames(t, g)[id] + " · " + periodName(g.format, qi));
}

/** Adds a game to the season totals, keeping the names of who played and who was absent. */
function markPlayed(t, g) {
  g.played = true;
  const inLineup = planPlayers(t, g);
  inLineup.forEach((p) => { g.names[p.id] = p.name; });
  g.absent = roster(t).filter((p) => !inLineup.includes(p)).map((p) => p.id);
  g.absent.forEach((id) => { g.names[id] = t.players.find((p) => p.id === id).name; });
}

async function shareLineup(t, g) {
  const text = lineupText(t, g);
  if (navigator.share) {
    try { await navigator.share({ text }); return; } catch (err) { if (err && err.name === "AbortError") return; }
  }
  textDialog("Share lineup", text);
}

function openGame(id) {
  ui.gameId = id;
  render();
  window.scrollTo(0, 0);
}

document.getElementById("main").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-action]");
  if (!b || b.disabled) return;
  if (sk) { scorekeeperClick(b); return; }
  const t = team();
  const g = currentGame(t);
  switch (b.dataset.action) {
    case "new-team":
      teamDialog(null);
      break;
    case "install":
      addToHomeScreen();
      break;
    case "install-later":
      hideInstallCard();
      toast("You can add it any time from the Team tab");
      break;
    case "edit-team":
      teamDialog(t);
      break;
    case "backup":
      backupDialog();
      break;
    case "export-calendar":
      exportCalendar(t);
      break;
    case "delete-team":
      if (b.dataset.armed) {
        state.teams = state.teams.filter((x) => x.id !== t.id);
        state.currentTeamId = state.teams[0] ? state.teams[0].id : null;
        ui = { tab: state.teams.length ? "team" : "players", gameId: null };
        commit();
        toast(t.name + " deleted");
      } else {
        b.dataset.armed = "1";
        b.textContent = "Tap again to delete " + t.name + " for good";
      }
      break;
    case "sample-team": {
      const nt = newTeam("Sample team", "SIX_2_3", "QUARTERS");
      SAMPLE_NAMES.forEach((n, i) => nt.players.push({ id: newItemId(nt), name: n, number: SAMPLE_NUMBERS[i], goalie: true, preferred: [] }));
      if (document.getElementById("sample-games").checked) addSampleGames(nt);
      state.teams.push(nt);
      state.currentTeamId = nt.id;
      ui.tab = "players";
      commit();
      toast("Sample team added. Rename or delete it on the Team tab.");
      break;
    }
    case "edit-player":
      playerDialog(t, t.players.find((p) => p.id === Number(b.dataset.id)));
      break;
    case "add-game":
      gameDialog(t, null);
      break;
    case "import-schedule":
      importDialog(t);
      break;
    case "quick-game": {
      const ng = { id: newItemId(t), date: todayStr(), opponent: "", home: "", time: "", place: "", plan: null, formation: t.formation, format: t.format, played: false, names: {}, goals: [], oppGoals: [] };
      t.games.push(ng);
      ui.gameId = ng.id;
      commit();
      break;
    }
    case "open-game":
      openGame(Number(b.dataset.id));
      break;
    case "back":
      ui.gameId = null;
      render();
      break;
    case "edit-game":
      gameDialog(t, g);
      break;
    case "make-lineup":
      lineupDialog(t, g);
      break;
    case "period-formation": {
      const qi = Number(b.dataset.qi);
      const word = periodWord(g.format);
      const later = g.plan.length - qi - 1;
      formationDialog(periodName(g.format, qi) + " formation",
        `Kids on the field stay on and kids sitting stay off. Only spots change: everyone moves to the nearest open spot.`,
        periodFormation(g, g.plan[qi]), "Change formation",
        later ? `Also use it for the rest of the game (${later} more ${later === 1 ? word : word + "s"})` : null,
        (formation, rest) => {
          const prefs = (id) => (t.players.find((p) => p.id === id) || { preferred: [] }).preferred;
          g.plan = g.plan.map((q, i) => (i === qi || (rest && i > qi) ? changeFormation(q, formation, prefs) : q));
          commit();
          toast(formationName(formation) + (rest && later ? " from " : " for ") + periodName(g.format, qi));
        });
      break;
    }
    case "game-more":
      openDialog(`<h2>More</h2>
        <div class="menu-list">
          <button class="btn" type="button" data-d="share">${ICON.share} Share lineup as text</button>
          <button class="btn" type="button" data-d="scorekeeper">${ICON.qr} Parent scorekeeper code</button>
          <button class="btn" type="button" data-d="scan">${ICON.scan} Scan the parent's score</button>
        </div>
        <div class="dlg-actions"><button class="btn" type="button" data-d="cancel">Close</button></div>`, {
        share: () => { closeDialog(); shareLineup(t, g); },
        scorekeeper: () => scorekeeperDialog(t, g),
        scan: () => scanDialog(),
      });
      break;
    case "mark-played":
      confirmDialog("Mark this game as played?", "It's added to the season totals, so future lineups give more time to kids who've sat more.", "Mark as played", () => {
        markPlayed(t, g);
        commit();
        toast("Game marked as played");
      });
      break;
    case "share-results":
      shareResultsDialog(t, g);
      break;
    case "coach-share":
      coachShareDialog(t);
      break;
    case "coach-get":
      scanDialog("team");
      break;
    case "opp-goal": {
      const qi = Number(b.dataset.qi);
      if (!doubleTap("opp:" + qi, "Double-tap to add an opponent goal")) break;
      g.oppGoals.push({ p: qi });
      commit();
      toast(oppName(g) + " goal · " + periodName(g.format, qi));
      break;
    }
    case "remove-opp-goal": {
      g.oppGoals.splice(Number(b.dataset.i), 1);
      commit();
      toast("Removed " + oppName(g) + " goal");
      break;
    }
    case "remove-goal": {
      const [x] = g.goals.splice(Number(b.dataset.i), 1);
      commit();
      if (x) toast("Removed " + (gameNames(t, g)[x.id] || "") + "'s goal");
      break;
    }
    case "unmark-played":
      g.played = false;
      commit();
      toast("Removed from season totals");
      break;
    case "archive-season":
      archiveDialog(t);
      break;
    case "open-archive":
      ui.archiveId = Number(b.dataset.id);
      ui.archiveGameId = null;
      render();
      window.scrollTo(0, 0);
      break;
    case "archive-back":
      ui.archiveId = null;
      render();
      break;
    case "open-archive-game":
      ui.archiveGameId = Number(b.dataset.id);
      render();
      window.scrollTo(0, 0);
      break;
    case "archive-game-back":
      ui.archiveGameId = null;
      render();
      break;
    case "delete-archive": {
      const a = currentArchive(t);
      if (!a) break;
      if (b.dataset.armed) {
        t.archives = t.archives.filter((x) => x.id !== a.id);
        forget(t, [a.id]);
        ui.archiveId = null;
        commit();
        toast(a.name + " deleted");
      } else {
        b.dataset.armed = "1";
        b.textContent = "Tap again to delete " + a.name + " for good";
      }
      break;
    }
    case "spot": {
      const qi = Number(b.dataset.qi), slot = b.dataset.slot;
      const hint = slot.startsWith("F:") ? "Double-tap to add a goal · hold and drag to move" : "Hold and drag to move";
      if (doubleTap(qi + "|" + slot, hint)) addGoal(t, g, qi, slot);
      break;
    }
  }
});

// ------------------------------------------------------------------ Drag to swap
// Press and hold a player (or press and move, with a mouse), then drop them on another spot in
// the same period. The hold lets a finger still scroll the page across the pitch.

let drag = null, suppressClickUntil = 0;
const HOLD_MS = 250;
const mainEl = document.getElementById("main");
function dropTarget(x, y) {
  const el = document.elementFromPoint(x, y);
  const s = el && el.closest('.spot[data-action="spot"]');
  return s && s.dataset.qi === drag.el.dataset.qi && s !== drag.el ? s : null;
}
function liftDrag() {
  drag.lifted = true;
  clearTimeout(tapHintTimer);
  lastTap = null;
  drag.ghost = drag.el.cloneNode(true);
  drag.ghost.classList.add("drag-ghost");
  drag.ghost.removeAttribute("data-action");
  drag.ghost.style.width = drag.el.getBoundingClientRect().width + "px";
  document.body.appendChild(drag.ghost);
  drag.el.classList.add("lifted");
  if (navigator.vibrate) navigator.vibrate(15);
  moveDrag(drag.x, drag.y);
  autoScroll();
}
/** Scrolls while a player is held near the top or bottom of the screen. */
function autoScroll() {
  if (!drag || !drag.lifted) return;
  const edge = 70;
  const dy = drag.y < edge ? -(edge - drag.y) / 4 : drag.y > innerHeight - edge ? (drag.y - innerHeight + edge) / 4 : 0;
  if (dy) { window.scrollBy(0, dy); moveDrag(drag.x, drag.y); }
  requestAnimationFrame(autoScroll);
}
function moveDrag(x, y) {
  drag.x = x; drag.y = y;
  drag.ghost.style.left = x + "px";
  drag.ghost.style.top = y + "px";
  const over = dropTarget(x, y);
  if (over !== drag.over) {
    if (drag.over) drag.over.classList.remove("drop");
    if (over) over.classList.add("drop");
    drag.over = over;
  }
}
function endDrag(drop) {
  const d = drag;
  drag = null;
  clearTimeout(d.timer);
  if (!d.lifted) return;
  d.ghost.remove();
  d.el.classList.remove("lifted");
  if (d.over) d.over.classList.remove("drop");
  // Lifting the finger after a drag isn't also a tap.
  suppressClickUntil = Date.now() + 400;
  const t = team(), g = currentGame(t);
  if (!drop || !d.over || !g || !g.plan) return;
  g.plan = swap(g.plan, Number(d.el.dataset.qi), d.el.dataset.slot, d.over.dataset.slot);
  commit();
}
mainEl.addEventListener("pointerdown", (e) => {
  const el = e.target.closest('.spot[data-action="spot"]');
  if (!el || drag || (e.pointerType === "mouse" && e.button !== 0)) return;
  drag = { el, x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, id: e.pointerId, mouse: e.pointerType === "mouse", lifted: false, over: null };
  if (!drag.mouse) drag.timer = setTimeout(() => { if (drag && !drag.lifted) liftDrag(); }, HOLD_MS);
});
window.addEventListener("pointermove", (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.lifted) {
    if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) <= 8) return;
    // A finger that moves before the hold is up is scrolling; a mouse starts dragging.
    if (!drag.mouse) { endDrag(false); return; }
    drag.x = e.clientX; drag.y = e.clientY;
    liftDrag();
  }
  moveDrag(e.clientX, e.clientY);
});
window.addEventListener("pointerup", (e) => { if (drag && e.pointerId === drag.id) endDrag(true); });
window.addEventListener("pointercancel", (e) => { if (drag && e.pointerId === drag.id) endDrag(false); });
// Once a player is lifted, the finger moves them instead of scrolling the page.
window.addEventListener("touchmove", (e) => { if (drag && drag.lifted && e.cancelable) e.preventDefault(); }, { passive: false });
mainEl.addEventListener("contextmenu", (e) => { if (e.target.closest(".spot[data-action]")) e.preventDefault(); });
mainEl.addEventListener("click", (e) => {
  if (Date.now() < suppressClickUntil) { e.stopImmediatePropagation(); e.preventDefault(); }
}, true);

// The sticky score sits just under the top bar, whatever its height.
const topBar = document.querySelector("header.top");
new ResizeObserver(() => document.documentElement.style.setProperty("--top-h", topBar.offsetHeight + "px")).observe(topBar);

stampChanges(true);
readHash();
render();
initCloud();
window.addEventListener("hashchange", () => { if (/^#(skr?|team)=/.test(location.hash)) { closeDialog(); readHash(); render(); } });
</script>
