<style>
/* Layout: one narrow column like a clipboard; each period is drawn as a little pitch, forwards at the top. */
:root {
  --bg: #eef2ec;
  --surface: #ffffff;
  --ink: #18241c;
  --muted: #5a6a5f;
  --line: #d5ddd3;
  --accent: #1f7a3f;
  --accent-ink: #ffffff;
  --pitch: #2e8a4d;
  --pitch-stripe: #2a7f47;
  --chalk: rgba(255, 255, 255, 0.55);
  --chip: #ffffff;
  --chip-ink: #18241c;
  --bench: #e3e8e1;
  --select: #f0b429;
  --warn-bg: #fdf0d8;
  --warn-ink: #6b4a00;
  --danger: #b3261e;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1410; --surface: #172019; --ink: #e5ede6; --muted: #98a89c; --line: #2a372e;
    --accent: #4cc27a; --accent-ink: #062310; --pitch: #1d5a33; --pitch-stripe: #1a5330;
    --chalk: rgba(255, 255, 255, 0.35); --chip: #f3f7f3; --chip-ink: #18241c; --bench: #222c25;
    --select: #f0b429; --warn-bg: #3a2f14; --warn-ink: #f5d58a; --danger: #ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1410; --surface: #172019; --ink: #e5ede6; --muted: #98a89c; --line: #2a372e;
  --accent: #4cc27a; --accent-ink: #062310; --pitch: #1d5a33; --pitch-stripe: #1a5330;
  --chalk: rgba(255, 255, 255, 0.35); --chip: #f3f7f3; --chip-ink: #18241c; --bench: #222c25;
  --select: #f0b429; --warn-bg: #3a2f14; --warn-ink: #f5d58a; --danger: #ff8a80;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--surface);
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--select); outline-offset: 2px; }

.wrap {
  max-width: 640px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Header */
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
header.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.team-btn {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px;
  background: none; border: 0; padding: 4px 0; text-align: left;
}
.team-btn .names { min-width: 0; display: grid; }
.team-btn .name {
  font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; line-height: 1.1;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.team-btn .sub { font-size: 0.85rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.team-btn .caret { flex: none; width: 22px; height: 22px; color: var(--muted); }
.sync { font-size: 0.75rem; color: var(--muted); white-space: nowrap; }

main { padding-block: 16px 110px; display: grid; gap: 14px; }

/* Bottom tabs */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
nav.tabs .wrap { display: grid; grid-template-columns: repeat(3, 1fr); }
nav.tabs button {

<script>
// ------------------------------------------------------------------ Soccer data

const POS = {
  GK: { label: "Goalie", short: "G", line: "GOAL" },
  LD: { label: "Left Defense", short: "LD", line: "DEFENSE" },
  CD: { label: "Center Defense", short: "CD", line: "DEFENSE" },
  RD: { label: "Right Defense", short: "RD", line: "DEFENSE" },
  LM: { label: "Left Mid", short: "LM", line: "MIDFIELD" },
  CM: { label: "Center Mid", short: "CM", line: "MIDFIELD" },
  RM: { label: "Right Mid", short: "RM", line: "MIDFIELD" },
  LF: { label: "Left Forward", short: "LF", line: "FORWARD" },
  CF: { label: "Center Forward", short: "CF", line: "FORWARD" },
  RF: { label: "Right Forward", short: "RF", line: "FORWARD" },
};
const POS_ORDER = Object.keys(POS);

// `fill` is the order spots are filled when not enough kids show up; the last ones are left empty first.
const FORMATIONS = {
  SIX_2_3: { label: "6v6: 2 defense, 3 forward", fill: ["GK", "LD", "RD", "CF", "LF", "RF"] },
  SEVEN_2_3_1: { label: "7v7: 2 defense, 3 mid, 1 forward", fill: ["GK", "LD", "RD", "CM", "CF", "LM", "RM"] },
  NINE_3_3_2: { label: "9v9: 3 defense, 3 mid, 2 forward", fill: ["GK", "CD", "LD", "RD", "CM", "LF", "RF", "LM", "RM"] },
  NINE_3_2_3: { label: "9v9: 3 defense, 2 mid, 3 forward", fill: ["GK", "CD", "LD", "RD", "LM", "RM", "CF", "LF", "RF"] },
  NINE_2_3_3: { label: "9v9: 2 defense, 3 mid, 3 forward", fill: ["GK", "LD", "RD", "CM", "CF", "LM", "RM", "LF", "RF"] },
};
const formationPositions = (f) => POS_ORDER.filter((k) => FORMATIONS[f].fill.includes(k));

const FORMATS = {
  QUARTERS: { label: "4 quarters", periods: 4, unit: "quarters" },
  HALVES: { label: "2 halves", periods: 2, unit: "halves" },
  HALVES_SPLIT: { label: "2 halves, swap mid-half", periods: 4, unit: "segments" },
};
function periodName(format, i) {
  if (format === "QUARTERS") return "Quarter " + (i + 1);
  if (format === "HALVES") return i === 0 ? "1st half" : "2nd half";
  return (i < 2 ? "1st half" : "2nd half") + (i % 2 === 0 ? " – start" : " – mid");
}

// ------------------------------------------------------------------ Lineup planner

const ATTEMPTS = 400;
const shuffle = (a) => {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};
const byKeys = (...keys) => (a, b) => {
  for (const k of keys) {
    const d = k(a) - k(b);
    if (d) return d;
  }
  return 0;
};

/**
 * Builds every period of a game. Bench time is always spread as evenly as possible; among
 * many random candidates, the one with the best goalie spread, position variety and
 * preferred positions wins. Ties go against kids who have sat least this season.
 */
function generate(players, formation, periods, season) {
  if (!players.length) return Array.from({ length: periods }, () => ({ positions: {}, bench: [] }));
  let best = null, bestScore = Infinity;
  for (let i = 0; i < ATTEMPTS; i++) {
    const plan = candidate(players, FORMATIONS[formation].fill, periods, season);
    const s = score(plan, players, season);
    if (s < bestScore) { best = plan; bestScore = s; }
  }
  return best;
}

function candidate(players, fill, periods, season) {
  const onField = fill.slice(0, Math.min(fill.length, players.length));
  const benchSize = players.length - onField.length;
  const sits = {}, gk = {};
  players.forEach((p) => { sits[p.id] = 0; gk[p.id] = 0; });
  const posCount = new Map();
  const count = (id, pos) => posCount.get(id + "|" + pos) || 0;
  const lineCount = (id, line) => POS_ORDER.reduce((s, k) => s + (POS[k].line === line ? count(id, k) : 0), 0);
  const seasonOf = (p) => season[p.id] || {};
  let lastBench = new Set(), lastGoalie = null;
  const out = [];

  for (let q = 0; q < periods; q++) {
    // Bench: fewest sits this game, then not twice in a row, then fewest sits this season.
    const bench = shuffle(players.slice())
      .sort(byKeys((p) => sits[p.id], (p) => (lastBench.has(p.id) ? 1 : 0), (p) => seasonOf(p).sat || 0))
      .slice(0, benchSize)
      .map((p) => p.id);
    bench.forEach((id) => sits[id]++);
    const benchSet = new Set(bench);
    let playing = shuffle(players.filter((p) => !benchSet.has(p.id)));
    const positions = {};

    // Goalie: eligible kids with the fewest goalie turns, kids who like goal first, not the last goalie.
    const goalie = playing.slice().sort(byKeys(
      (p) => (p.goalie ? 0 : 1),
      (p) => gk[p.id] * 2 - (p.preferred.includes("GK") ? 1 : 0),
      (p) => (p.id === lastGoalie ? 1 : 0),
      (p) => seasonOf(p).goalie || 0,
    ))[0];
    positions.GK = goalie.id;
    gk[goalie.id]++;
    playing = playing.filter((p) => p !== goalie);
    lastGoalie = goalie.id;

    // Field spots: each goes to whoever likes it, or has played it least.
    for (const pos of shuffle(onField.filter((k) => k !== "GK"))) {
      let pick = null, cost = Infinity;
      for (const p of playing) {
        const c = p.preferred.includes(pos) ? -25 : count(p.id, pos) * 10 + lineCount(p.id, POS[pos].line) * 3;
        if (c < cost) { cost = c; pick = p; }
      }
      positions[pos] = pick.id;
      posCount.set(pick.id + "|" + pos, count(pick.id, pos) + 1);
      playing = playing.filter((p) => p !== pick);
    }
    lastBench = benchSet;
    out.push({ positions, bench });
  }
  return out;
}

/** Lower is better. */
function score(plan, players, season) {
  const sums = summarize(plan, players);
  let s = 0;
  const sat = sums.map((x) => x.sat);
  if (sat.length) s += (Math.max(...sat) - Math.min(...sat)) * 1000;
  const eligible = players.filter((p) => p.goalie);
  const fewestSeasonGoalie = eligible.length ? Math.min(...eligible.map((p) => (season[p.id] || {}).goalie || 0)) : 0;
  sums.forEach((x, i) => {
    const p = players[i];
    const likesGoal = p.preferred.includes("GK");
    const gk = x.positions.filter((k) => k === "GK").length;
    if (gk > 0 && !p.goalie && eligible.length) s += 500 * gk;
    if (gk > 1 && !likesGoal) s += (gk - 1) * (gk - 1) * 60;
    if (!likesGoal) s += gk * (((season[p.id] || {}).goalie || 0) - fewestSeasonGoalie) * 30;
    for (let j = 1; j < x.positions.length; j++) if (!x.positions[j] && !x.positions[j - 1]) s += 40;
    s -= x.positions.filter((k) => k && p.preferred.includes(k)).length * 40;
    const repeats = {};
    x.positions.filter((k) => k && !p.preferred.includes(k)).forEach((k) => { repeats[k] = (repeats[k] || 0) + 1; });
    Object.values(repeats).forEach((n) => { if (n > 1) s += (n - 1) * 8; });
    const lines = x.positions.filter((k) => k && k !== "GK").map((k) => POS[k].line);
    if (!p.preferred.length && lines.length >= 2 && new Set(lines).size === 1) s += 5;
  });
  return s;
}

function summarize(plan, players) {
  return players.map((p) => {
    const positions = plan.map((q) => Object.keys(q.positions).find((k) => q.positions[k] === p.id) || null);
    const played = positions.filter(Boolean).length;
    return { id: p.id, positions, played, sat: positions.length - played };
  });
}

function record(plan, players, season) {
  const next = { ...season };
  summarize(plan, players).forEach((x) => {
    const t = next[x.id] || { played: 0, sat: 0, goalie: 0, games: 0 };
    next[x.id] = {
      played: t.played + x.played,
      sat: t.sat + x.sat,
      goalie: t.goalie + x.positions.filter((k) => k === "GK").length,
      games: t.games + 1,
    };
  });
  return next;
}

// A slot is "F:LD" (a field position) or "B:0" (a bench seat).
function playerAt(period, slot) {
  const [kind, key] = slot.split(":");
  return kind === "F" ? period.positions[key] ?? null : period.bench[Number(key)] ?? null;
}
function swap(plan, qi, a, b) {
  const q = plan[qi];
  const pa = playerAt(q, a), pb = playerAt(q, b);
  const positions = { ...q.positions }, bench = q.bench.slice();
  const put = (slot, id) => {
    const [kind, key] = slot.split(":");
    if (kind === "F") { if (id == null) delete positions[key]; else positions[key] = id; }
    else if (id != null) bench[Number(key)] = id;
  };
  put(a, pb); put(b, pa);
  return plan.map((x, i) => (i === qi ? { positions, bench } : x));
}

function lineupText(t, g) {
  const players = planPlayers(t, g);
  const names = gameNames(t, g);
  const lines = [t.name + " – " + longDate(g.date) + (g.opponent ? " vs " + g.opponent : "")];
  g.plan.forEach((q, i) => {
    lines.push("", periodName(g.format, i));
    POS_ORDER.forEach((k) => { if (q.positions[k] != null) lines.push("  " + POS[k].short + ": " + names[q.positions[k]]); });
    if (q.bench.length) lines.push("  Sits: " + q.bench.map((id) => names[id]).join(", "));
  });
  lines.push("", "Playing time (" + FORMATS[g.format].unit + ")");
  summarize(g.plan, players).forEach((x) => lines.push("  " + names[x.id] + ": " + x.played + "/" + g.plan.length));
  const scorers = Object.entries(goalsByPlayer([g]));
  if (scorers.length) lines.push("", "Goals: " + scorers.map(([id, n]) => names[id] + (n > 1 ? " " + n : "")).join(", "));
  return lines.join("\n");
}

// ------------------------------------------------------------------ League report

function periodShort(format, i) {
  if (format === "QUARTERS") return "Q" + (i + 1);
  if (format === "HALVES") return "H" + (i + 1);
  return (i < 2 ? "1" : "2") + (i % 2 === 0 ? "A" : "B");
}
/** Everything the league report shows, in one place for the text, table and picture versions. */
function reportData(t, g) {
  const names = gameNames(t, g);
  const players = planPlayers(t, g);
  const goals = goalsByPlayer([g]);
  const absentIds = g.absent || t.players.filter((p) => !players.includes(p)).map((p) => p.id);
  return {
    title: t.name + (g.opponent ? " vs " + g.opponent : ""),
    team: t.name,
    opponent: g.opponent,
    date: toDate(g.date).toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" }),
    game: FORMATIONS[g.formation].label.split(":")[0] + ", " + FORMATS[g.format].label,
    unit: FORMATS[g.format].unit,
    periods: g.plan.map((_, i) => periodShort(g.format, i)),
    legend: g.format === "HALVES_SPLIT" ? "A = start of the half, B = after the mid-half swap" : "",
    rows: summarize(g.plan, players).map((x) => ({
      name: names[x.id],
      cells: x.positions.map((k) => (k ? POS[k].short : "–")),
      played: x.played + "/" + g.plan.length,
      goals: goals[x.id] || 0,
    })),
    absent: absentIds.map((id) => names[id]).filter(Boolean),
    totalGoals: g.goals.length,
  };
}
function reportSubject(d) {
  return d.title + " – " + d.date + " – playing time";
}
function reportText(d) {
  const lines = [
    "Team: " + d.team,
    "Date: " + d.date,
    "Opponent: " + (d.opponent || "—"),
    "Game: " + d.game,
    "",
    "Playing time (" + d.unit + " played, then position each " + (d.unit === "quarters" ? "quarter" : d.unit === "halves" ? "half" : "segment") + "):",
  ];
  d.rows.forEach((r) => {
    const spots = r.cells.map((c, i) => d.periods[i] + " " + (c === "–" ? "sat" : c)).join(", ");
    lines.push("• " + r.name + ": " + r.played + " (" + spots + ")" + (r.goals ? " – " + r.goals + (r.goals === 1 ? " goal" : " goals") : ""));
  });
  if (d.legend) lines.push("", d.legend);
  lines.push("", "Absent: " + (d.absent.length ? d.absent.join(", ") : "none"));
  return lines.join("\n");
}
function reportHTML(d) {
  const cell = "border:1px solid #c9d3c7;padding:6px 10px;text-align:center;color:#18241c;font-family:Arial,Helvetica,sans-serif;font-size:14px;";
  const head = "background:#1f7a3f;color:#ffffff;font-weight:bold;";
  return `<div style="font-family:Arial,Helvetica,sans-serif;color:#18241c;">
    <p style="margin:0 0 4px;font-size:18px;font-weight:bold;">${esc(d.title)}</p>
    <p style="margin:0 0 10px;font-size:14px;color:#4a5a4f;">${esc(d.date)} · ${esc(d.game)}</p>
    <table style="border-collapse:collapse;font-size:14px;color:#18241c;background:#ffffff;">
      <tr><th style="${cell}${head}text-align:left;">Player</th>${d.periods.map((p) => `<th style="${cell}${head}">${p}</th>`).join("")}<th style="${cell}${head}">Played</th><th style="${cell}${head}">Goals</th></tr>
      ${d.rows.map((r, i) => `<tr style="background:${i % 2 ? "#f2f6f1" : "#ffffff"};"><td style="${cell}text-align:left;">${esc(r.name)}</td>${r.cells.map((c) => `<td style="${cell}${c === "–" ? "color:#8a968d;" : ""}">${c}</td>`).join("")}<td style="${cell}font-weight:bold;">${r.played}</td><td style="${cell}">${r.goals || ""}</td></tr>`).join("")}
    </table>
    ${d.legend ? `<p style="margin:8px 0 0;font-size:13px;color:#4a5a4f;">${esc(d.legend)}</p>` : ""}
    <p style="margin:8px 0 0;font-size:13px;color:#4a5a4f;">Absent: ${esc(d.absent.length ? d.absent.join(", ") : "none")}</p>
  </div>`;
}
/** Draws the report table as a picture (always light, like paper). */
function reportCanvas(d) {
  const scale = 2, pad = 28, rowH = 38, cellW = 62, playedW = 84, goalsW = 70;
  const probe = document.createElement("canvas").getContext("2d");
  probe.font = "600 17px 'Source Sans 3', Arial, sans-serif";
  const nameW = Math.max(150, ...d.rows.map((r) => probe.measureText(r.name).width + 28));
  const tableW = nameW + cellW * d.periods.length + playedW + goalsW;
  const notes = [d.legend, "Absent: " + (d.absent.length ? d.absent.join(", ") : "none")].filter(Boolean);
  const top = 96;
  const width = pad * 2 + tableW;
  const height = top + rowH * (d.rows.length + 1) + 18 + notes.length * 24 + pad;
  const c = document.createElement("canvas");
  c.width = width * scale;
  c.height = height * scale;
  const x = c.getContext("2d");
  x.scale(scale, scale);
  x.fillStyle = "#ffffff";
  x.fillRect(0, 0, width, height);
  x.fillStyle = "#18241c";
  x.font = "700 26px 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif";
  x.fillText(d.title, pad, pad + 22);
  x.fillStyle = "#4a5a4f";
  x.font = "16px 'Source Sans 3', Arial, sans-serif";
  x.fillText(d.date + " · " + d.game, pad, pad + 50);
  const cols = [["Player", nameW, "left"], ...d.periods.map((p) => [p, cellW, "center"]), ["Played", playedW, "center"], ["Goals", goalsW, "center"]];
  const row = (y, values, bg, fg, font) => {
    x.fillStyle = bg;
    x.fillRect(pad, y, tableW, rowH);
    let cx = pad;
    values.forEach((v, i) => {
      const [, w, align] = cols[i];
      x.fillStyle = typeof fg === "function" ? fg(v, i) : fg;
      x.font = typeof font === "function" ? font(v, i) : font;
      x.textAlign = align;
      x.fillText(String(v), align === "left" ? cx + 12 : cx + w / 2, y + rowH / 2 + 6);
      cx += w;
    });
    x.textAlign = "left";
  };
  row(top, cols.map((col) => col[0]), "#1f7a3f", "#ffffff", "700 16px 'Source Sans 3', Arial, sans-serif");
  d.rows.forEach((r, i) => row(top + rowH * (i + 1), [r.name, ...r.cells, r.played, r.goals || ""], i % 2 ? "#f2f6f1" : "#ffffff",
    (v, j) => (v === "–" ? "#8a968d" : "#18241c"),
    (v, j) => (j === 0 ? "600 17px" : j === cols.length - 2 ? "700 17px" : "17px") + " 'Source Sans 3', Arial, sans-serif"));
  // grid lines
  x.strokeStyle = "#c9d3c7";
  x.lineWidth = 1;
  const bottom = top + rowH * (d.rows.length + 1);
  for (let i = 0; i <= d.rows.length + 1; i++) {
    x.beginPath(); x.moveTo(pad, top + rowH * i + 0.5); x.lineTo(pad + tableW, top + rowH * i + 0.5); x.stroke();
  }
  let cx = pad;
  [...cols, null].forEach((col) => {
    x.beginPath(); x.moveTo(Math.round(cx) + 0.5, top); x.lineTo(Math.round(cx) + 0.5, bottom); x.stroke();
    if (col) cx += col[1];
  });
  x.fillStyle = "#4a5a4f";
  x.font = "15px 'Source Sans 3', Arial, sans-serif";
  notes.forEach((n, i) => x.fillText(n, pad, bottom + 28 + i * 24));
  return c;
}

// ------------------------------------------------------------------ Dates

const pad = (n) => String(n).padStart(2, "0");
const dateStr = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const todayStr = () => dateStr(new Date());
const toDate = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = toDate(s); d.setDate(d.getDate() + n); return dateStr(d); };
const longDate = (s) => toDate(s).toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });

// ------------------------------------------------------------------ State and saving

const LOCAL_KEY = "soccer-rotation";
let state = normalize(readLocal()) || { version: 3, nextId: 1, currentTeamId: null, teams: [], savedAt: 0 };
let ui = { tab: state.teams.length ? "games" : "players", gameId: null, selected: null };
let cloudRef = null, cloudTimer = null, cloudBusy = false, cloudPending = false;

function readLocal() {
  try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || "null"); } catch (e) { return null; }
}
function normalize(s) {
  if (!s || !Array.isArray(s.teams)) return null;
  s.nextId = s.nextId || 1;
  s.savedAt = s.savedAt || 0;
  s.teams.forEach((t) => {
    t.players = (t.players || []).map((p) => ({ id: p.id, name: p.name, goalie: p.goalie !== false, preferred: p.preferred || [] }));
    t.absent = t.absent || [];
    t.formation = FORMATIONS[t.formation] ? t.formation : "SIX_2_3";
    t.format = FORMATS[t.format] ? t.format : "QUARTERS";
    t.games = (t.games || []).map((g) => ({
      id: g.id,
      date: g.date || todayStr(),
      opponent: g.opponent || "",
      plan: g.plan || null,
      formation: FORMATIONS[g.formation] ? g.formation : t.formation,
      format: FORMATS[g.format] ? g.format : t.format,
      played: !!g.played,
      names: g.names || {},
      goals: Array.isArray(g.goals) ? g.goals : [],
      ...(Array.isArray(g.absent) ? { absent: g.absent } : {}),
    }));
    if (!t.seasonCarry) {
      // Version 2 kept a single lineup plus running season totals. The lineup becomes a game
      // dated today; totals from earlier saves are carried over without double-counting it.
      const carry = JSON.parse(JSON.stringify(t.season || {}));
      if (t.plan) {
        const g = { id: s.nextId++, date: todayStr(), opponent: "", plan: t.plan, formation: t.formation, format: t.format, played: !!t.planSaved, names: {}, goals: [] };
        if (g.played) {
          summarize(g.plan, planPlayers(t, g)).forEach((x) => {
            const c = carry[x.id];
            if (!c) return;
            c.played = Math.max(0, c.played - x.played);
            c.sat = Math.max(0, c.sat - x.sat);
            c.goalie = Math.max(0, c.goalie - x.positions.filter((k) => k === "GK").length);
            c.games = Math.max(0, c.games - 1);
          });
        }
        t.games.push(g);
      }
      t.seasonCarry = carry;
    }
    delete t.plan;
    delete t.planSaved;
    delete t.season;
  });
  s.version = 3;
  return s;
}
function commit() {
  state.savedAt = Date.now();
  try { localStorage.setItem(LOCAL_KEY, JSON.stringify(state)); } catch (e) { /* storage blocked: keep going in memory */ }
  if (cloudRef) {
    clearTimeout(cloudTimer);
    cloudTimer = setTimeout(pushCloud, 700);
  }
  render();
}
async function pushCloud() {
  if (cloudBusy) { cloudPending = true; return; }
  cloudBusy = true;
  try {
    await cloudRef.set({ json: JSON.stringify(state) });
    setSync("Saved to your account");
  } catch (e) {
    setSync("Saved on this device");
  } finally {
    cloudBusy = false;
    if (cloudPending) { cloudPending = false; pushCloud(); }
  }
}
function setSync(text) {
  const el = document.getElementById("sync");
  el.textContent = text;
  el.hidden = !text;
}

// When opened from the claude.ai link, keep a private copy in the viewer's account so it follows them across devices.
async function initCloud() {
  if (!window.claude || typeof window.claude.use !== "function") return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    const ref = db.doc("data/users/" + uid + "/state");
    const snap = await ref.get();
    cloudRef = ref;
    const remote = snap.exists ? normalize(JSON.parse(snap.data().json || "null")) : null;
    if (remote && remote.savedAt >= state.savedAt) {
      state = remote;
      try { localStorage.setItem(LOCAL_KEY, JSON.stringify(state)); } catch (e) {}
      if (!state.teams.length) ui.tab = "players";
      render();
      setSync("Saved to your account");
    } else if (state.teams.length) {
      pushCloud();
    } else {
      setSync("Saved to your account");
    }
  } catch (e) {
    cloudRef = null;
  }
}

const team = () => state.teams.find((t) => t.id === state.currentTeamId) || state.teams[0] || null;
const present = (t) => t.players.filter((p) => !t.absent.includes(p.id));
const currentGame = (t) => (t && ui.gameId != null ? t.games.find((g) => g.id === ui.gameId) || null : null);
function planPlayers(t, g) {
  if (!g.plan || !g.plan.length) return [];
  const ids = new Set([...Object.values(g.plan[0].positions), ...g.plan[0].bench]);
  return t.players.filter((p) => ids.has(p.id));
}
/** Names for a game's lineup: current names, falling back to the name saved when it was played. */
function gameNames(t, g) {
  return { ...g.names, ...Object.fromEntries(t.players.map((p) => [p.id, p.name])) };
}
/** Season totals: carried-over totals plus every game marked played (optionally leaving one out). */
function seasonTotals(t, excludeId) {
  let totals = JSON.parse(JSON.stringify(t.seasonCarry || {}));
  t.games.forEach((g) => {
    if (g.played && g.plan && g.id !== excludeId) totals = record(g.plan, planPlayers(t, g), totals);
  });
  return totals;
}
const goalCount = (g, id, period) => g.goals.filter((x) => x.id === id && (period == null || x.p === period)).length;
function goalsByPlayer(games) {
  const out = {};
  games.forEach((g) => g.goals.forEach((x) => { out[x.id] = (out[x.id] || 0) + 1; }));
  return out;
}
function sameIds(a, b) {
  return a.length === b.length && a.every((p) => b.some((q) => q.id === p.id));
}
function newTeam(name, formation, format) {
  return { id: state.nextId++, name, formation, format, players: [], absent: [], games: [], seasonCarry: {} };
}

// ------------------------------------------------------------------ Rendering

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ICON = {
  edit: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75L3 17.25zM20.7 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>',

  refresh: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>',

  mail: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg>',
};

function render() {
  const t = team();
  document.getElementById("team-name").textContent = t ? t.name : "Soccer Rotation";
  document.getElementById("team-sub").textContent = t
    ? FORMATIONS[t.formation].label + " · " + FORMATS[t.format].label
    : "Fair playing time, every game";
  document.querySelectorAll("nav.tabs [data-tab]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === ui.tab)));
  const main = document.getElementById("main");
  if (!t) {
    main.innerHTML = `
      <div class="panel empty">
        <h2>Set up your first team</h2>
        <p class="hint">Add your players and game dates, check off who showed up, and get a lineup where every kid gets fair time on the field.</p>
        <button class="btn primary" type="button" data-action="new-team">${ICON.plus} Create a team</button>
        <button class="btn" type="button" data-action="sample-team">Try it with sample names</button>
      </div>`;
    return;
  }
  if (ui.tab === "players") main.innerHTML = playersView(t);
  else if (ui.tab === "games") {
    const g = currentGame(t);
    main.innerHTML = g ? gameView(t, g) : gamesView(t);
  } else main.innerHTML = seasonView(t);
}

function playersView(t) {
  const rows = t.players.map((p) => {
    const here = !t.absent.includes(p.id);
    const likes = POS_ORDER.filter((k) => p.preferred.includes(k) && FORMATIONS[t.formation].fill.includes(k)).map((k) => POS[k].short);
    const notes = [likes.length ? "Likes " + likes.join(", ") : "", p.goalie ? "" : "No goalie"].filter(Boolean).join(" · ");
    return `
      <div class="player${here ? "" : " out"}">
        <label class="here"><input type="checkbox" id="here-${p.id}" data-action="toggle-here" data-id="${p.id}" ${here ? "checked" : ""} aria-label="${esc(p.name)} is here"></label>
        <button class="pinfo" type="button" data-action="edit-player" data-id="${p.id}">
          <span class="pname">${esc(p.name)}</span>
          ${notes ? `<span class="pnotes">${esc(notes)}</span>` : ""}
        </button>
        <button class="icon-btn" type="button" data-action="edit-player" data-id="${p.id}" aria-label="Edit ${esc(p.name)}">${ICON.edit}</button>
      </div>`;
  }).join("");
  return `
    <div class="panel">
      <div><span class="count">${present(t).length} of ${t.players.length} here today</span></div>
      <p class="hint">Uncheck kids who are absent. Tap a name to rename them, set preferred positions, or turn off goalie.</p>
    </div>
    <form class="add-row" data-form="add-player">
      <input class="field" id="add-name" name="name" placeholder="Add a player" autocomplete="off" autocapitalize="words" enterkeyhint="done" aria-label="New player name">
      <button class="btn primary" type="submit" aria-label="Add player">${ICON.plus} Add</button>
    </form>
    <div class="roster">${rows}</div>`;
}

function gameStatus(g, today) {
  if (g.played) return ["played", "Played"];
  if (g.plan) return ["ready", "Lineup ready"];
  return ["none", g.date < today ? "No lineup" : "No lineup yet"];
}

function gamesView(t) {
  const today = todayStr();
  const games = t.games.slice().sort((a, b) => a.date.localeCompare(b.date) || a.id - b.id);
  const upcoming = games.filter((g) => g.date >= today && !g.played);
  const past = games.filter((g) => g.date < today || g.played).reverse();
  const hasToday = games.some((g) => g.date === today);
  const row = (g) => {
    const d = toDate(g.date);
    const [cls, label] = gameStatus(g, today);
    return `<button class="game-row${g.date === today ? " today" : ""}" type="button" data-action="open-game" data-id="${g.id}">
      <span class="gdate" aria-hidden="true">
        <span class="mon">${esc(d.toLocaleDateString(undefined, { month: "short" }))}</span>
        <span class="day">${d.getDate()}</span>
        <span class="dow">${esc(d.toLocaleDateString(undefined, { weekday: "short" }))}</span>
      </span>
      <span class="gmain"><strong>${g.opponent ? "vs " + esc(g.opponent) : "Game"}</strong>
        <small>${g.date === today ? "Today · " : ""}${esc(longDate(g.date))}</small></span>
      <span class="status s-${cls}">${label}</span>
    </button>`;
  };
  let html = `
    <div class="btn-row">
      <button class="btn primary grow" type="button" data-action="add-game">${ICON.plus} Add game</button>
      ${hasToday ? "" : `<button class="btn" type="button" data-action="quick-game">Game today</button>`}
    </div>`;
  if (!games.length) {
    return html + `<div class="panel empty">
      <h2>Add your schedule</h2>
      <p class="hint">Enter the dates from your team's schedule. On game day, open the game to make its lineup. Past games keep their lineups so you can look back.</p>
    </div>`;
  }
  if (upcoming.length) html += `<h3 class="section-title">Coming up</h3><div class="game-list">${upcoming.map(row).join("")}</div>`;
  if (past.length) html += `<h3 class="section-title">Past games</h3><div class="game-list">${past.map(row).join("")}</div>`;
  return html;
}

function gameView(t, g) {
  const plan = g.plan;
  const here = present(t);
  const changed = plan && !g.played && !sameIds(planPlayers(t, g), here);
  let html = `
    <div class="game-head">
      <button class="back" type="button" data-action="back">${ICON.back} All games</button>
      <div class="gh-row">
        <div class="gh-title"><h2>${g.opponent ? "vs " + esc(g.opponent) : "Game"}</h2><p class="hint">${esc(longDate(g.date))}</p></div>
        <button class="icon-btn" type="button" data-action="edit-game" aria-label="Edit game date or opponent">${ICON.edit}</button>
      </div>
    </div>`;

  if (!g.played) {
    html += `<div class="btn-row">
      <button class="btn primary grow" type="button" data-action="make-lineup" ${here.length ? "" : "disabled"}>${ICON.refresh} ${plan ? "New lineup" : "Make lineup"}</button>
      ${plan ? `<button class="btn" type="button" data-action="share">${ICON.share} Share</button>` : ""}
    </div>`;
    if (plan) html += `<button class="btn full" type="button" data-action="mark-played" ${changed ? "disabled" : ""}>${ICON.check} Mark as played</button>`;
  } else {
    html += `<div class="btn-row">
      <span class="played-note grow">${ICON.check} Played</span>
      <button class="btn" type="button" data-action="share">${ICON.share} Share</button>
    </div>
    <button class="btn primary full" type="button" data-action="email-report">${ICON.mail} Email league director</button>`;
  }

  if (!plan) {
    return html + `<p class="hint">${t.players.length
      ? `${here.length} of ${t.players.length} players are checked in on the Players tab. The lineup uses them, so update attendance first if needed.`
      : "Add your players on the Players tab first."}</p>`;
  }
  if (changed) html += `<div class="warn">Attendance changed since this lineup was made. Tap New lineup to include the right kids.</div>`;
  html += `<p class="hint">Tap two players in the same box to swap them. Double-tap a player on the field to add a goal.${g.played ? " Changes update the season totals." : ""} ★ marks a preferred spot.</p>`;

  const byId = Object.fromEntries(t.players.map((p) => [p.id, p]));
  const names = gameNames(t, g);
  plan.forEach((q, qi) => {
    const sel = ui.selected && ui.selected.qi === qi ? ui.selected.slot : null;
    const spot = (slot, label) => {
      const id = playerAt(q, slot);
      const p = id != null ? byId[id] : null;
      const name = id != null ? names[id] : null;
      const liked = p && slot.startsWith("F:") && p.preferred.includes(slot.slice(2));
      const goals = id != null ? goalCount(g, id, qi) : 0;
      const badge = goals ? `<span class="goal" aria-label="${goals} ${goals === 1 ? "goal" : "goals"}">⚽${goals > 1 ? goals : ""}</span>` : "";
      return `<button type="button" class="spot${sel === slot ? " sel" : ""}${name ? "" : " empty-spot"}" data-action="spot" data-qi="${qi}" data-slot="${slot}" aria-pressed="${sel === slot}">
        ${badge}<span class="pos">${label}${liked ? " ★" : ""}</span><span class="who">${name ? esc(name) : "—"}</span></button>`;
    };
    // Rows come from the lineup itself, so past games still draw right after a formation change.
    const rows = ["FORWARD", "MIDFIELD", "DEFENSE", "GOAL"]
      .map((line) => POS_ORDER.filter((k) => POS[k].line === line && q.positions[k] != null))
      .filter((r) => r.length)
      .map((r) => `<div class="prow">${r.map((k) => spot("F:" + k, POS[k].short)).join("")}</div>`)
      .join("");
    const bench = q.bench.length
      ? `<div class="bench"><span class="label">Sitting</span><div class="prow">${q.bench.map((_, i) => spot("B:" + i, "SITS")).join("")}</div></div>`
      : "";
    html += `<section class="panel period" aria-label="${esc(periodName(g.format, qi))}">
      <div class="period-head"><h2>${esc(periodName(g.format, qi))}</h2></div>
      <div class="pitch">${rows}</div>${bench}</section>`;
  });

  if (g.goals.length) {
    const list = g.goals
      .map((x, i) => ({ ...x, i }))
      .sort((a, b) => a.p - b.p || a.i - b.i)
      .map((x) => `<li><span><span class="gp">${esc(periodName(g.format, x.p))}</span> ${esc(names[x.id] || "—")}</span>
        <button class="icon-btn" type="button" data-action="remove-goal" data-i="${x.i}" aria-label="Remove ${esc(names[x.id] || "")}'s goal in ${esc(periodName(g.format, x.p))}">✕</button></li>`)
      .join("");
    html += `<section class="panel"><h2>Goals · ${g.goals.length}</h2><ul class="goal-list">${list}</ul></section>`;
  }

  const players = planPlayers(t, g);
  const unit = FORMATS[g.format].unit;
  const rows = summarize(plan, players).map((x, i) => `
    <tr><td class="nm">${esc(players[i].name)}${goalCount(g, x.id) ? ` <span class="goal-inline">⚽${goalCount(g, x.id) > 1 ? goalCount(g, x.id) : ""}</span>` : ""}</td>
    <td class="seq">${x.positions.map((k) => (k ? `<span class="tag">${POS[k].short}</span>` : `<span class="tag sat">–</span>`)).join("")}</td>
    <td class="tot">${x.played}/${plan.length}</td></tr>`).join("");
  html += `<section class="panel"><h2>Playing time</h2><p class="hint">Positions by ${unit === "halves" ? "half" : unit === "quarters" ? "quarter" : "segment"}, and ${unit} played.</p>
    <table class="timeline"><tbody>${rows}</tbody></table></section>`;
  if (g.played) html += `<button class="btn" type="button" data-action="unmark-played">Mark as not played</button>`;
  return html;
}

function seasonView(t) {
  const totals = seasonTotals(t);
  const played = t.games.filter((g) => g.played).length;
  const goals = goalsByPlayer(t.games);
  const rows = t.players.map((p) => {
    const s = totals[p.id] || { games: 0, played: 0, sat: 0, goalie: 0 };
    return `<tr><td>${esc(p.name)}</td><td>${s.games}</td><td>${s.played}</td><td>${s.sat}</td><td>${s.goalie}</td><td>${goals[p.id] || 0}</td></tr>`;
  }).join("");
  return `
    <div class="panel">
      <h2>Season totals</h2>
      <p class="hint">${played} ${played === 1 ? "game" : "games"} marked played for ${esc(t.name)}. New lineups give extra time to kids who've sat more, and spread goalie turns. Played and Sat count ${FORMATS[t.format].unit}. Goals count every game.</p>
      <div class="table-wrap"><table class="season">
        <thead><tr><th>Player</th><th>Games</th><th>Played</th><th>Sat</th><th>Goalie</th><th>Goals</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="6">No players yet.</td></tr>`}</tbody>
      </table></div>
    </div>
    <button class="btn" type="button" data-action="new-season" ${t.games.length || Object.keys(t.seasonCarry).length ? "" : "disabled"}>Start new season</button>`;
}

const dlg = document.getElementById("dlg");
let dlgHandlers = {};
function openDialog(html, handlers) {
  dlg.innerHTML = `<div class="dlg">${html}</div>`;
  dlgHandlers = handlers || {};
  if (!dlg.open) dlg.showModal();
  const first = dlg.querySelector("[autofocus]");
  if (first) first.focus();
}
function closeDialog() { if (dlg.open) dlg.close(); }
dlg.addEventListener("click", (e) => {
  if (e.target === dlg) return closeDialog(); // tap on the backdrop
  const b = e.target.closest("[data-d]");
  if (!b) return;
  const fn = dlgHandlers[b.dataset.d];
  if (b.dataset.d === "cancel") closeDialog();
  else if (fn) fn(b);
});

function confirmDialog(title, text, okLabel, onOk) {
  openDialog(`<h2>${esc(title)}</h2><p class="hint">${esc(text)}</p>
    <div class="dlg-actions"><button class="btn" type="button" data-d="cancel">Cancel</button>
    <button class="btn primary" type="button" data-d="ok">${esc(okLabel)}</button></div>`,
    { ok: () => { closeDialog(); onOk(); } });
}

function teamMenu() {

      ${t && x.id === t.id ? ICON.check.replace("<svg", '<svg width="20" height="20"') : ""}
    </button>`).join("");
  openDialog(`<h2>Teams</h2>
    <div class="team-list">${list}</div>
    <div class="dlg-actions">

      <button class="btn primary" type="button" data-d="new">${ICON.plus} New team</button>
    </div>`, {

function teamDialog(existing) {
  const f = existing ? existing.formation : "SIX_2_3";
  const g = existing ? existing.format : "QUARTERS";
  const radios = (name, opts, cur) => Object.entries(opts).map(([k, v]) => `
    <label class="choice"><input type="radio" name="${name}" id="${name}-${k}" value="${k}" ${k === cur ? "checked" : ""}> ${esc(v.label)}</label>`).join("");
  const hasOpenLineups = existing && existing.games.some((x) => x.plan && !x.played);
  openDialog(`<h2>${existing ? "Edit team" : "New team"}</h2>
    <div class="group"><label class="lbl" for="team-name-input">Team name</label>
      <input class="field" id="team-name-input" value="${existing ? esc(existing.name) : ""}" placeholder="e.g. U8 Thunder" autocapitalize="words" autofocus></div>
    <div class="group"><label class="lbl" for="team-director">League director's email <span class="hint">(optional, for game reports)</span></label>
      <input class="field" type="email" id="team-director" value="${existing ? esc(existing.director || "") : ""}" placeholder="director@example.org" inputmode="email" autocomplete="email"></div>
    <div class="group"><span class="lbl">Players on the field</span>${radios("formation", FORMATIONS, f)}</div>
    <div class="group"><span class="lbl">Game</span>${radios("format", FORMATS, g)}</div>
    ${hasOpenLineups ? `<p class="hint">Changing the formation or game clears lineups for games not yet played. Played games keep theirs.</p>` : ""}
    <div class="dlg-actions">
      ${existing ? `<button class="btn danger" type="button" data-d="delete" style="margin-right:auto">Delete team</button>` : ""}
      <button class="btn" type="button" data-d="cancel">Cancel</button>
      <button class="btn primary" type="button" data-d="save">Save</button>
    </div>`, {
    save: () => {
      const name = dlg.querySelector("#team-name-input").value.trim();
      if (!name) { dlg.querySelector("#team-name-input").focus(); return; }
      const formation = dlg.querySelector('input[name="formation"]:checked').value;
      const format = dlg.querySelector('input[name="format"]:checked').value;
      const director = dlg.querySelector("#team-director").value.trim();
      if (existing) {
        existing.director = director;
        const keep = existing.formation === formation && existing.format === format;
        Object.assign(existing, { name, formation, format });
        if (!keep) {
          existing.games.forEach((x) => { if (!x.played) x.plan = null; });
          ui.selected = null;
        }
      } else {
        const t = newTeam(name, formation, format);
        t.director = director;
        state.teams.push(t);
        state.currentTeamId = t.id;
        ui.tab = "players";
        ui.gameId = null;
      }
      closeDialog();
      commit();
    },
    delete: (b) => {
      if (b.dataset.armed) {
        state.teams = state.teams.filter((x) => x.id !== existing.id);
        state.currentTeamId = state.teams[0] ? state.teams[0].id : null;
        ui.gameId = null;
        closeDialog();
        commit();
      } else {
        b.dataset.armed = "1";
        b.textContent = "Tap again to delete " + existing.name;
      }
    },
  });
}

function gameDialog(t, g) {
  const last = t.games.reduce((m, x) => (x.date > m ? x.date : m), "");
  const suggested = last && last >= todayStr() ? addDays(last, 7) : todayStr();
  const date = g ? g.date : suggested;
  openDialog(`<h2>${g ? "Edit game" : "Add game"}</h2>
    <div class="group"><label class="lbl" for="game-date">Date</label>
      <input class="field" type="date" id="game-date" value="${date}"></div>
    <div class="group"><label class="lbl" for="game-opp">Opponent <span class="hint">(optional)</span></label>
      <input class="field" id="game-opp" value="${g ? esc(g.opponent) : ""}" placeholder="e.g. Tigers" autocapitalize="words"></div>
    <p class="hint" id="game-msg" hidden></p>
    <div class="dlg-actions">
      ${g ? `<button class="btn danger" type="button" data-d="delete" style="margin-right:auto">Delete game</button>` : ""}
      <button class="btn" type="button" data-d="cancel">Cancel</button>
      ${g ? "" : `<button class="btn" type="button" data-d="another">Add another</button>`}
      <button class="btn primary" type="button" data-d="save">Save</button>
    </div>`, {
    save: () => saveGame(false),
    another: () => saveGame(true),
    delete: (b) => {
      if (b.dataset.armed) {
        t.games = t.games.filter((x) => x.id !== g.id);
        ui.gameId = null;
        closeDialog();
        commit();
      } else {
        b.dataset.armed = "1";
        b.textContent = g.played ? "Tap again: also removes it from season totals" : "Tap again to delete this game";
      }
    },
  });
  function saveGame(another) {
    const d = dlg.querySelector("#game-date").value;
    const msg = dlg.querySelector("#game-msg");
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) {
      msg.hidden = false;
      msg.textContent = "Pick the game's date.";
      return;
    }
    const opponent = dlg.querySelector("#game-opp").value.trim();
    if (g) {
      g.date = d;
      g.opponent = opponent;
    } else {
      t.games.push({ id: state.nextId++, date: d, opponent, plan: null, formation: t.formation, format: t.format, played: false, names: {}, goals: [] });
    }
    commit();
    if (another) {
      gameDialog(t, null);
      dlg.querySelector("#game-date").value = addDays(d, 7);
      dlg.querySelector("#game-opp").focus();
      toast("Added " + longDate(d));
    } else {
      closeDialog();
    }
  }
}

function playerDialog(t, p) {
  let preferred = p.preferred.slice();
  const chips = () => formationPositions(t.formation).map((k) => `
    <button type="button" class="chip-toggle" data-d="pref" data-pos="${k}" aria-pressed="${preferred.includes(k)}">${POS[k].label}</button>`).join("");
  openDialog(`<h2>Edit player</h2>
    <div class="group"><label class="lbl" for="player-name-input">Name</label>
      <input class="field" id="player-name-input" value="${esc(p.name)}" autocapitalize="words"></div>
    <label class="switch-row" for="player-goalie"><span>Can play goalie</span><input type="checkbox" id="player-goalie" ${p.goalie ? "checked" : ""}></label>
    <div class="group"><span class="lbl">Preferred positions</span>
      <p class="hint">The lineup puts them here whenever they're on the field. Leave empty to rotate everywhere.</p>
      <div class="chips" id="pref-chips">${chips()}</div></div>
    <div class="dlg-actions">
      <button class="btn danger" type="button" data-d="remove" style="margin-right:auto">Remove from team</button>
      <button class="btn" type="button" data-d="cancel">Cancel</button>
      <button class="btn primary" type="button" data-d="save">Save</button>
    </div>`, {
    pref: (b) => {
      const k = b.dataset.pos;
      if (k === "GK" && !dlg.querySelector("#player-goalie").checked) return;
      preferred = preferred.includes(k) ? preferred.filter((x) => x !== k) : [...preferred, k];
      b.setAttribute("aria-pressed", String(preferred.includes(k)));
    },
    save: () => {
      const name = dlg.querySelector("#player-name-input").value.trim();
      if (!name) { dlg.querySelector("#player-name-input").focus(); return; }
      p.name = name;
      p.goalie = dlg.querySelector("#player-goalie").checked;
      p.preferred = p.goalie ? preferred : preferred.filter((k) => k !== "GK");
      closeDialog();
      commit();
    },
    remove: (b) => {
      if (b.dataset.armed) {
        // Keep their name on past games they played in.
        t.games.forEach((g) => { if (g.played) g.names[p.id] = g.names[p.id] || p.name; });
        t.players = t.players.filter((x) => x.id !== p.id);
        t.absent = t.absent.filter((id) => id !== p.id);
        delete t.seasonCarry[p.id];
        closeDialog();
        commit();
      } else {
        b.dataset.armed = "1";
        b.textContent = "Tap again to remove " + p.name;
      }
    },
  });
  const goalieBox = dlg.querySelector("#player-goalie");
  const syncGoalieChip = () => {
    const chip = dlg.querySelector('[data-pos="GK"]');
    if (!chip) return;
    chip.disabled = !goalieBox.checked;
    if (!goalieBox.checked) { preferred = preferred.filter((k) => k !== "GK"); chip.setAttribute("aria-pressed", "false"); }
  };
  goalieBox.addEventListener("change", syncGoalieChip);
  syncGoalieChip();
}

function emailDialog(t, g) {
  const d = reportData(t, g);
  const subject = reportSubject(d);
  const body = reportText(d);
  const mailHref = (to) => "mailto:" + encodeURIComponent(to.trim()).replace(/%40/g, "@") +
    "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
  openDialog(`<h2>Email league director</h2>
    <div class="report-preview">${reportHTML(d)}</div>
    <div class="group"><label class="lbl" for="director-email">League director's email</label>
      <input class="field" type="email" id="director-email" value="${esc(t.director || "")}" placeholder="director@example.org" autocomplete="email" inputmode="email"></div>
    <div class="email-actions">
      <a class="btn primary" id="mail-link" href="${mailHref(t.director || "")}">${ICON.mail} Open email</a>
      <button class="btn" type="button" data-d="picture">${ICON.share} Send as picture</button>
      <button class="btn" type="button" data-d="copy">Copy table</button>
    </div>
    <p class="hint"><strong>Open email</strong> fills in the address, subject and playing time as text. <strong>Send as picture</strong> shares an image of the table to attach. <strong>Copy table</strong> lets you paste the table into an email.</p>
    <div id="picture-out" hidden></div>
    <div class="dlg-actions"><button class="btn" type="button" data-d="cancel">Close</button></div>`, {
    picture: async () => {
      saveDirector();
      const canvas = reportCanvas(d);
      const blob = await new Promise((res) => canvas.toBlob(res, "image/png"));
      const file = blob && new File([blob], (d.title + " " + g.date).replace(/[^\w-]+/g, "-") + ".png", { type: "image/png" });
      if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: subject, text: subject }); return; }
        catch (err) { if (err && err.name === "AbortError") return; }
      }
      // No file sharing here: show the picture so it can be saved with a long press.
      const out = dlg.querySelector("#picture-out");
      out.hidden = false;
      out.innerHTML = `<p class="hint">Press and hold the picture to save or share it, then attach it to your email.</p><img alt="Playing time table" src="${canvas.toDataURL("image/png")}">`;
      out.scrollIntoView({ block: "nearest" });
    },
    copy: async () => {
      saveDirector();
      try {
        await navigator.clipboard.write([new ClipboardItem({
          "text/html": new Blob([reportHTML(d)], { type: "text/html" }),
          "text/plain": new Blob([body], { type: "text/plain" }),
        })]);
        toast("Table copied. Paste it into your email.");
      } catch (e) {
        try { await navigator.clipboard.writeText(body); toast("Copied as text"); }
        catch (e2) { textDialog("Playing time", subject + "\n\n" + body); }
      }
    },
  });
  const input = dlg.querySelector("#director-email");
  const link = dlg.querySelector("#mail-link");
  function saveDirector() {
    const v = input.value.trim();
    if (v !== (t.director || "")) { t.director = v; commit(); }
  }
  input.addEventListener("input", () => { link.href = mailHref(input.value); });
  input.addEventListener("change", saveDirector);
  link.addEventListener("click", saveDirector);
}

    <textarea class="field" id="share-text" readonly rows="12">${esc(text)}</textarea>
    <div class="dlg-actions"><button class="btn" type="button" data-d="cancel">Close</button>
    <button class="btn primary" type="button" data-d="copy">Copy</button></div>`, {

function backupDialog() {
  openDialog(`<h2>Back up or move data</h2>
    <p class="hint">Copy this text and keep it somewhere safe, or paste it into the app on another phone.</p>
    <textarea class="field" id="backup-out" readonly>${esc(JSON.stringify(state))}</textarea>
    <button class="btn" type="button" data-d="copy">Copy backup</button>
    <div class="group"><label class="lbl" for="backup-in">Restore from a backup</label>
      <textarea class="field" id="backup-in" placeholder="Paste backup text here"></textarea></div>
    <p class="hint" id="restore-msg" hidden></p>
    <div class="dlg-actions"><button class="btn" type="button" data-d="cancel">Close</button>
    <button class="btn primary" type="button" data-d="restore">Replace my data</button></div>`, {
    copy: () => copyText(dlg.querySelector("#backup-out")),
    restore: () => {
      const msg = dlg.querySelector("#restore-msg");
      let parsed = null;
      try { parsed = normalize(JSON.parse(dlg.querySelector("#backup-in").value)); } catch (e) {}
      if (!parsed) {
        msg.hidden = false;
        msg.textContent = "That text isn't a Soccer Rotation backup. Copy the whole backup and try again.";
        return;
      }
      state = parsed;
      ui = { tab: "games", gameId: null, selected: null };
      closeDialog();
      commit();
      toast("Backup restored");
    },
  });
}

async function copyText(textarea) {
  try {
    await navigator.clipboard.writeText(textarea.value);
    toast("Copied");
  } catch (e) {
    textarea.focus();
    textarea.select();
    toast("Selected. Use your phone's Copy.");
  }
}

let toastTimer = null;
function toast(text) {
  const el = document.getElementById("toast");
  el.textContent = text;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 2200);
}

const SAMPLE_NAMES = ["Ava", "Ben", "Chloe", "Diego", "Emma", "Finn", "Grace", "Hiro"];

document.getElementById("team-btn").addEventListener("click", () => (state.teams.length ? teamMenu() : teamDialog(null)));
document.querySelectorAll("nav.tabs [data-tab]").forEach((b) => b.addEventListener("click", () => {
  // Tapping Games while already there goes back to the list.
  if (b.dataset.tab === "games" && ui.tab === "games") ui.gameId = null;
  ui.tab = b.dataset.tab;
  ui.selected = null;
  render();
  window.scrollTo(0, 0);
}));

document.getElementById("main").addEventListener("submit", (e) => {
  if (e.target.dataset.form !== "add-player") return;
  e.preventDefault();
  const input = document.getElementById("add-name");
  const name = input.value.trim();
  if (!name) return;
  team().players.push({ id: state.nextId++, name, goalie: true, preferred: [] });
  commit();
  document.getElementById("add-name").focus();
});

document.getElementById("main").addEventListener("change", (e) => {
  const el = e.target;
  if (el.dataset.action !== "toggle-here") return;
  const t = team(), id = Number(el.dataset.id);
  t.absent = el.checked ? t.absent.filter((x) => x !== id) : [...t.absent, id];
  commit();
});

let lastTap = null;
function addGoal(t, g, qi, slot) {
  const id = playerAt(g.plan[qi], slot);
  if (id == null) { render(); return; }
  if (!slot.startsWith("F:")) {
    render();
    toast("Only players on the field can score");
    return;
  }
  g.goals.push({ id, p: qi });
  commit();
  toast("Goal: " + gameNames(t, g)[id] + " · " + periodName(g.format, qi));
}

function openGame(id) {
  ui.gameId = id;
  ui.selected = null;
  render();
  window.scrollTo(0, 0);
}

document.getElementById("main").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-action]");
  if (!b || b.disabled) return;
  const t = team();
  const g = currentGame(t);
  switch (b.dataset.action) {
    case "new-team":
      teamDialog(null);
      break;
    case "sample-team": {
      const nt = newTeam("Sample team", "SIX_2_3", "QUARTERS");
      SAMPLE_NAMES.forEach((n) => nt.players.push({ id: state.nextId++, name: n, goalie: true, preferred: [] }));
      state.teams.push(nt);
      state.currentTeamId = nt.id;
      ui.tab = "players";
      commit();
      toast("Sample team added. Rename or delete it from the team menu.");
      break;
    }
    case "edit-player":
      playerDialog(t, t.players.find((p) => p.id === Number(b.dataset.id)));
      break;
    case "add-game":
      gameDialog(t, null);
      break;
    case "quick-game": {
      const ng = { id: state.nextId++, date: todayStr(), opponent: "", plan: null, formation: t.formation, format: t.format, played: false, names: {}, goals: [] };
      t.games.push(ng);
      ui.gameId = ng.id;
      commit();
      break;
    }
    case "open-game":
      openGame(Number(b.dataset.id));
      break;
    case "back":
      ui.gameId = null;
      ui.selected = null;
      render();
      break;
    case "edit-game":
      gameDialog(t, g);
      break;
    case "make-lineup": {
      const go = () => {
        g.plan = generate(present(t), t.formation, FORMATS[t.format].periods, seasonTotals(t, g.id));
        g.formation = t.formation;
        g.format = t.format;
        ui.selected = null;
        commit();
      };
      if (g.plan) confirmDialog("Replace this lineup?", "Any swaps you made will be lost.", "Replace", go);
      else go();
      break;
    }
    case "share": {
      const text = lineupText(t, g);
      if (navigator.share) {
        try { await navigator.share({ text }); return; } catch (err) { if (err && err.name === "AbortError") return; }
      }
      textDialog("Share lineup", text);
      break;
    }
    case "mark-played":
      confirmDialog("Mark this game as played?", "It's added to the season totals, so future lineups give more time to kids who've sat more.", "Mark as played", () => {
        g.played = true;
        const inLineup = planPlayers(t, g);
        inLineup.forEach((p) => { g.names[p.id] = p.name; });
        g.absent = t.players.filter((p) => !inLineup.includes(p)).map((p) => p.id);
        g.absent.forEach((id) => { g.names[id] = t.players.find((p) => p.id === id).name; });
        commit();
        toast("Game marked as played");
      });
      break;
    case "email-report":
      emailDialog(t, g);
      break;
    case "remove-goal": {
      const [x] = g.goals.splice(Number(b.dataset.i), 1);
      commit();
      if (x) toast("Removed " + (gameNames(t, g)[x.id] || "") + "'s goal");
      break;
    }
    case "unmark-played":
      g.played = false;
      commit();
      toast("Removed from season totals");
      break;
    case "new-season":
      confirmDialog("Start a new season?", "This removes all of " + t.name + "'s games, past and upcoming, and clears season totals. Players stay.", "Start new season", () => {
        t.games = [];
        t.seasonCarry = {};
        ui.gameId = null;
        commit();
      });
      break;
    case "spot": {
      const qi = Number(b.dataset.qi), slot = b.dataset.slot;
      const cur = ui.selected;
      const now = Date.now();
      // A second tap on the same spot right after selecting it is a double-tap: record a goal.
      if (lastTap && lastTap.qi === qi && lastTap.slot === slot && now - lastTap.at < 450) {
        lastTap = null;
        ui.selected = null;
        addGoal(t, g, qi, slot);
        return;
      }
      lastTap = !cur || cur.qi !== qi ? { qi, slot, at: now } : null;
      if (!cur || cur.qi !== qi) ui.selected = { qi, slot };
      else if (cur.slot === slot) ui.selected = null;
      else {
        g.plan = swap(g.plan, qi, cur.slot, slot);
        ui.selected = null;
        commit();
        return;
      }
      render();
      break;
    }
  }
});

render();
initCloud();
</script>
