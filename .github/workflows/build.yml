name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # The runner image ships with the Android SDK (ANDROID_HOME is preset).
      - name: Build
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        run: |
          msg=$(grep -E '^e: |What went wrong|error:' -A3 build.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=Build errors::${msg:-see log}"
      - uses: actions/upload-artifact@v4
        with:
          name: soccer-rotation-apk
          path: app/build/outputs/apk/release/app-release.apk
      # Keep one "latest" release holding the newest APK, for an easy download on a phone.
      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk soccer-rotation.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest soccer-rotation.apk --target "$GITHUB_SHA" --latest \
            --title "Soccer Rotation (latest)" --notes "Built from ${GITHUB_SHA::7}. Download soccer-rotation.apk below and open it on your phone."
