name: Publish beta

# Pushing to beta asks the main publishing workflow to rebuild, which publishes the beta
# branch at /beta/ alongside main.
on:
  push:
    branches: [beta]
    paths: ["web/**", "tools/**"]

permissions:
  actions: write

jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild the site from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
